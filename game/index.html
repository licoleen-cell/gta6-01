<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solvado Heat</title>
<meta name="description" content="Solvado Heat: an open-world crime game on the Palm Coast. Steal cars, run jobs, lose the police.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solvado Heat: a top-down open-world crime game. Walk with W A S D, drive with the arrow keys, E to enter or leave a car, J to punch, P to pause."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
